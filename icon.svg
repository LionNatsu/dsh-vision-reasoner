<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#7c8698" stroke-width="1.5" stroke-linecap="round">
  <!--
    A picture with a ruler along its top edge and two numbered places ringed on
    it: the whole method in one mark — a place is only usable if the picture
    says where it is.

    The colour is explicit rather than `currentColor`, because the plugin
    listing and the settings inventory render this file as an image, where there
    is no inherited colour to take and `currentColor` resolves to black.
  -->
  <rect x="2.9" y="4.4" width="18.2" height="15.2" rx="2.2"/>
  <path d="M7 4.4v2.1M10.5 4.4v3M14 4.4v2.1M17.5 4.4v3" stroke-width="1.1" opacity="0.7"/>
  <circle cx="9.1" cy="13.4" r="2.7"/>
  <circle cx="16.1" cy="12.1" r="2.2" opacity="0.7"/>
</svg>
